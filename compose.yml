# Ghostfolio oficial + serviço de sincronização local.
# Uso (nesta pasta):  docker compose up -d --build
include:
  - docker/docker-compose.yml

services:
  ghostfolio-sync:
    build: custom/sync
    container_name: ghostfolio-sync
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - custom/sync/sync.env
    environment:
      GHOSTFOLIO_URL: http://ghostfolio:3333
      EXTRATOS_DIR: /extratos
      DATA_DIR: /data
      RELATORIOS_DATA_DIR: /relatorios
    volumes:
      # Solte aqui os .xlsx da B3 (Movimentação e Posição) e o ajustes.json
      - ./extratos:/extratos:ro
      - sync-data:/data
      # Outros usuários que enviaram extratos pelos relatórios (token cifrado).
      - relatorios-data:/relatorios:ro
    depends_on:
      ghostfolio:
        condition: service_healthy

  ghostfolio-relatorios:
    build: custom/relatorios
    container_name: ghostfolio-relatorios
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - custom/sync/sync.env
    environment:
      GHOSTFOLIO_URL: http://ghostfolio:3333
      EXTRATOS_DIR: /extratos
      DATA_DIR: /data
    volumes:
      # Gravável: os extratos podem ser enviados pela tela dos relatórios.
      - ./extratos:/extratos
      - relatorios-data:/data
    ports:
      - 3334:3334
    depends_on:
      ghostfolio:
        condition: service_healthy

volumes:
  sync-data:
  relatorios-data:
