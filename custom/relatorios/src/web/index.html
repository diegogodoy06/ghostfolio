<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="ghostfolio-url" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0d0d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Hub · finanças e vida</title>
    <link rel="icon" href="icons/ghost.svg" />
    <!-- App instalável: "Adicionar à tela inicial" abre em tela cheia, sem a barra do navegador. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Carteira" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip" href="#main">Ir para o conteúdo</a>
    <!-- Celular: barra superior com a marca e as ações. -->
    <header class="topbar">
      <span class="brand"><span class="logo" aria-hidden="true"></span><b>Hub</b></span>
      <span class="spacer"></span>
      <button class="gf-menu-btn icon" id="gf-menu" aria-label="Menu" aria-expanded="false"><span class="ico" style="--icon: url(icons/person-circle-outline.svg)"></span></button>
      <div class="gf-menu" id="gf-menu-list" hidden>
        <a href="#" id="logout"><span class="ico" style="--icon: url(icons/log-out-outline.svg)"></span>Sair / trocar de usuário</a>
      </div>
    </header>

    <div class="app">
      <aside class="sidebar" aria-label="Navegação">
        <div class="sb-panel">
          <div class="sb-brand"><span class="logo" aria-hidden="true"></span><b>Hub</b><span class="muted small">finanças &amp; vida</span></div>
          <label class="sb-switch" title="Conta exibida">
            <span class="avatar" id="acc-initial">C</span>
            <span class="t"><b id="acc-name">Consolidado</b><small id="acc-sub">todas as contas</small></span>
            <span class="ico" style="--icon: url(icons/chevron-expand.svg)"></span>
            <select id="account" aria-label="Conta"></select>
          </label>
          <nav class="side-tabs tabs" role="tablist" aria-label="Seções">
            <span class="sb-group">Visão geral</span>
            <button role="tab" data-tab="resumo"><span class="ico" style="--icon: url(icons/grid-outline.svg)"></span><span>Resumo</span></button>
            <span class="sb-group">Investimentos</span>
            <button role="tab" data-tab="carteira"><span class="ico" style="--icon: url(icons/pie-chart-outline.svg)"></span><span>Carteira</span></button>
            <button role="tab" data-tab="proventos"><span class="ico" style="--icon: url(icons/cash-outline.svg)"></span><span>Proventos</span></button>
            <button role="tab" data-tab="rentabilidade"><span class="ico" style="--icon: url(icons/trending-up-outline.svg)"></span><span>Rentabilidade</span></button>
            <span class="sb-group">Vida</span>
            <button role="tab" data-tab="metas"><span class="ico" style="--icon: url(icons/flag-outline.svg)"></span><span>Metas</span></button>
            <button role="tab" data-tab="saude"><span class="ico" style="--icon: url(icons/fitness-outline.svg)"></span><span>Saúde</span></button>
            <button role="tab" data-tab="financas"><span class="ico" style="--icon: url(icons/wallet-outline.svg)"></span><span>Finanças</span><span class="ico chev" style="--icon: url(icons/chevron-down.svg)"></span></button>
            <div class="sb-sub" id="fin-sub">
              <button data-finview="mes">Mês</button>
              <button data-finview="lancamentos">Lançamentos</button>
              <button data-finview="cartoes">Cartões</button>
              <button data-finview="categorias">Categorias</button>
              <button data-finview="previstos">Previstos</button>
            </div>
          </nav>
        </div>
        <div class="sb-ask">
          <span class="sb-ask-ico"><span class="ico" style="--icon: url(icons/sparkles-outline.svg)"></span></span>
          <b>Pergunte ao Claude</b>
          <p>Entenda o que está acontecendo e o que fazer a seguir.</p>
          <button class="primary" id="claude-ask">Analisar com Claude</button>
        </div>
        <div class="sb-user">
          <span class="avatar"><span class="ico" style="--icon: url(icons/person-circle-outline.svg)"></span></span>
          <span class="t"><b>Minha conta</b><small>sair ou trocar de usuário</small></span>
          <button class="icon" id="sb-logout" title="Sair / trocar de usuário" aria-label="Sair"><span class="ico" style="--icon: url(icons/log-out-outline.svg)"></span></button>
        </div>
      </aside>

      <div class="content">
        <div class="page-head">
          <div class="ph-title">
            <h1 id="page-title">Resumo</h1>
            <span class="ph-meta" id="page-meta"></span>
          </div>
          <div class="top-actions">
            <div class="toggle scope" id="scope" role="group" aria-label="O que mostrar">
              <button data-scope="tudo" title="Carteira e reserva de emergência juntas">Tudo</button>
              <button data-scope="carteira" title="Sem a reserva de emergência">Carteira</button>
              <button data-scope="reserva" title="Só o que tem o marcador Fundo de Emergência">Reserva</button>
            </div>
            <!-- No celular estes botões sobem para a barra superior (fixa), ao lado do perfil. -->
            <div class="actions-group" id="actions">
              <button id="claude" class="icon claude-mini" title="Analisar com Claude" aria-label="Analisar com Claude"><span class="ico" style="--icon: url(icons/sparkles-outline.svg)"></span></button>
              <button id="extratos" class="icon" aria-label="Extratos da B3" title="Enviar extratos da B3"><span class="ico" style="--icon: url(icons/cloud-upload-outline.svg)"></span></button>
              <button id="privacy" class="icon" aria-pressed="false" aria-label="Ocultar valores"><span class="ico" style="--icon: url(icons/eye-outline.svg)"></span></button>
              <button id="refresh" class="icon" title="Atualizar" aria-label="Atualizar"><span class="ico" style="--icon: url(icons/refresh-outline.svg)"></span></button>
            </div>
          </div>
        </div>
        <main id="main"></main>
      </div>
    </div>

    <template id="login-tpl">
      <form class="card login">
        <h2>Entrar</h2>
        <p class="muted">Use o token de segurança do <b>seu</b> usuário no Ghostfolio. Cada usuário vê só a própria carteira, com simulação e metas próprias. O acesso fica salvo neste aparelho.</p>
        <input name="token" type="password" autocomplete="current-password" placeholder="Token de segurança" required />
        <button type="submit" class="primary">Entrar</button>
        <p class="error" hidden></p>
      </form>
    </template>
    <script src="app.js"></script>
  </body>
</html>
