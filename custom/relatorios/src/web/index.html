<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="ghostfolio-url" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#191919" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Relatórios · Ghostfolio</title>
    <link rel="icon" href="icons/ghost.svg" />
    <!-- App instalável: "Adicionar à tela inicial" abre em tela cheia, sem a barra do navegador. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Carteira" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Barra superior no mesmo formato do Ghostfolio: o app é uma extensão dele. -->
    <header class="gf-toolbar">
      <a class="gf-logo" data-gf="home" title="Ghostfolio"><span class="logo" aria-hidden="true"></span><span class="label">Ghostfolio</span></a>
      <span class="spacer"></span>
      <nav class="gf-links" aria-label="Ghostfolio">
        <a data-gf="home">Visão geral</a>
        <a data-gf="portfolio">Portefólio</a>
        <a data-gf="accounts">Contas</a>
        <a class="active" href="./" aria-current="page">Relatórios</a>
        <a data-gf="resources">Recursos</a>
      </nav>
      <button class="gf-menu-btn" id="gf-menu" aria-label="Menu" aria-expanded="false"><span class="ico" style="--icon: url(icons/person-circle-outline.svg)"></span></button>
      <div class="gf-menu" id="gf-menu-list" hidden>
        <a data-gf="home"><span class="ico" style="--icon: url(icons/home-outline.svg)"></span>Visão geral</a>
        <a data-gf="portfolio"><span class="ico" style="--icon: url(icons/pie-chart-outline.svg)"></span>Portefólio</a>
        <a data-gf="accounts"><span class="ico" style="--icon: url(icons/wallet-outline.svg)"></span>Contas</a>
        <a data-gf="resources"><span class="ico" style="--icon: url(icons/open-outline.svg)"></span>Recursos</a>
        <hr />
        <a href="#" id="logout"><span class="ico" style="--icon: url(icons/log-out-outline.svg)"></span>Sair / trocar de usuário</a>
      </div>
    </header>

    <div class="page">
      <nav class="side-tabs tabs" role="tablist" aria-label="Relatórios">
        <button role="tab" data-tab="resumo"><span class="ico" style="--icon: url(icons/analytics-outline.svg)"></span><span>Resumo</span></button>
        <button role="tab" data-tab="carteira"><span class="ico" style="--icon: url(icons/pie-chart-outline.svg)"></span><span>Carteira</span></button>
        <button role="tab" data-tab="proventos"><span class="ico" style="--icon: url(icons/cash-outline.svg)"></span><span>Proventos</span></button>
        <button role="tab" data-tab="rentabilidade"><span class="ico" style="--icon: url(icons/trending-up-outline.svg)"></span><span>Rentabilidade</span></button>
        <button role="tab" data-tab="metas"><span class="ico" style="--icon: url(icons/flag-outline.svg)"></span><span>Metas</span></button>
      </nav>
      <div class="content">
        <div class="page-head">
          <h1 id="page-title">Resumo</h1>
          <div class="top-actions">
            <div class="toggle scope" id="scope" role="group" aria-label="O que mostrar">
              <button data-scope="tudo" title="Carteira e reserva de emergência juntas">Tudo</button>
              <button data-scope="carteira" title="Sem a reserva de emergência">Carteira</button>
              <button data-scope="reserva" title="Só o que tem o marcador Fundo de Emergência">Reserva</button>
            </div>
            <select id="account" aria-label="Conta"></select>
            <!-- No celular estes botões sobem para a barra superior (fixa), ao lado do perfil. -->
            <div class="actions-group" id="actions">
              <button id="claude" class="ghost claude-btn" title="Gerar prompt com os dados da carteira para o Claude" aria-label="Analisar com Claude"><span class="ico" style="--icon: url(icons/sparkles-outline.svg)"></span><span>Analisar com Claude</span></button>
              <button id="extratos" class="icon" aria-label="Extratos da B3" title="Enviar extratos da B3"><span class="ico" style="--icon: url(icons/cloud-upload-outline.svg)"></span></button>
              <button id="privacy" class="icon" aria-pressed="false" aria-label="Ocultar valores"><span class="ico" style="--icon: url(icons/eye-outline.svg)"></span></button>
              <button id="refresh" class="icon" title="Atualizar" aria-label="Atualizar"><span class="ico" style="--icon: url(icons/refresh-outline.svg)"></span></button>
            </div>
          </div>
        </div>
        <main id="main"></main>
      </div>
    </div>

    <template id="login-tpl">
      <form class="card login">
        <h2>Entrar</h2>
        <p class="muted">Use o token de segurança do <b>seu</b> usuário no Ghostfolio. Cada usuário vê só a própria carteira, com simulação e metas próprias. O acesso fica salvo neste aparelho.</p>
        <input name="token" type="password" autocomplete="current-password" placeholder="Token de segurança" required />
        <button type="submit" class="primary">Entrar</button>
        <p class="error" hidden></p>
      </form>
    </template>
    <script src="app.js"></script>
  </body>
</html>
