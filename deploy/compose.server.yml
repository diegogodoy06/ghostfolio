# Servidor atrás de um proxy reverso com HTTPS (Nginx Proxy Manager, Cloudflare Tunnel...).
# O proxy encaminha GF_DOMAIN → <ip do servidor>:3333 e REL_DOMAIN → <ip do servidor>:3334.
# Ativado pelo COMPOSE_FILE do .env do servidor.
services:
  ghostfolio-relatorios:
    environment:
      # Links do topo dos relatórios apontam para o domínio do Ghostfolio.
      PUBLIC_GHOSTFOLIO_URL: https://${GF_DOMAIN:?defina GF_DOMAIN no .env}
