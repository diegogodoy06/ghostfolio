# wger: motor da aba Saúde (peso, dias de academia, treinos). Versão enxuta para o servidor:
# sem Celery e sem PowerSync (só servem ao app móvel e a sincronizações em segundo plano).
name: wger
x-log: &log
  driver: json-file
  options: { max-size: 10m, max-file: "3" }
services:
  web:
    image: docker.io/wger/server:latest
    container_name: wg-web
    env_file: .env
    environment:
      SITE_URL: ${WG_SITE_URL}
      CSRF_TRUSTED_ORIGINS: ${WG_SITE_URL}
      TIME_ZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      WGER_INSTANCE: https://wger.de
      ALLOW_REGISTRATION: "False"
      ALLOW_GUEST_USERS: "False"
      USE_CELERY: "False"
      DJANGO_PERFORM_MIGRATIONS: "True"
      DJANGO_DEBUG: "False"
      DJANGO_CACHE_BACKEND: django_redis.cache.RedisCache
      DJANGO_CACHE_LOCATION: redis://cache:6379/1
      DJANGO_CACHE_TIMEOUT: "1296000"
      DJANGO_CACHE_CLIENT_CLASS: django_redis.client.DefaultClient
      WGER_USE_GUNICORN: "True"
      GUNICORN_CMD_ARGS: --workers 1 --threads 3 --worker-class gthread --timeout 240
      NUMBER_OF_PROXIES: "1"
    volumes:
      - static:/home/wger/static
      - media:/home/wger/media
    expose: ["8000"]
    depends_on:
      db: { condition: service_healthy }
      cache: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8000/api/v2/version/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 300s
    logging: *log
    restart: unless-stopped
  nginx:
    image: docker.io/nginx:stable
    container_name: wg-nginx
    ports: ["3336:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/wger/static:ro
      - media:/wger/media:ro
    depends_on: [web]
    logging: *log
    restart: unless-stopped
  db:
    image: docker.io/postgres:15-alpine
    container_name: wg-db
    env_file: .env
    environment:
      TZ: America/Sao_Paulo
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=20"]
    volumes:
      - postgres-data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U \"$$POSTGRES_USER\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *log
    restart: unless-stopped
  cache:
    image: docker.io/redis:7-alpine
    container_name: wg-cache
    command: ["redis-server", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *log
    restart: unless-stopped
volumes:
  postgres-data:
  static:
  media:
